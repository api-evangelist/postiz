    integrations (channels), groups, posts, uploads, analytics, notifications and AI
    video generation, served at https://api.postiz.com/public/v1 on Cloud and at
    {NEXT_PUBLIC_BACKEND_URL}/public/v1 on any self-hosted instance. Harvested verbatim
    from the OpenAPI 3.1.0 document Postiz links from its own llms.txt.
