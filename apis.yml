- aid: postiz:postiz-mcp-server
  name: Postiz MCP Server
  description: >-
    Hosted, remote Model Context Protocol server run as part of the Postiz backend,
    exposing 11 tools for listing channels, reading platform settings schemas,
    scheduling and re-settings posts, and generating AI images and video. Reachable
    today at https://api.postiz.com/mcp with an API key or OAuth token as a Bearer
    credential, at /mcp/{apiKey} for clients that only accept a URL, and at /mcp-oauth
    as an OAuth-protected resource with RFC 8414 and RFC 9728 discovery.
  humanURL: https://docs.postiz.com/mcp/introduction
  baseURL: https://api.postiz.com/mcp
  tags:
  - MCP
  - Agents
  - Social-Media
  tags_raw:
