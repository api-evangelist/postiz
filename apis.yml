  - type: Documentation
    url: https://docs.postiz.com/mcp/introduction
- aid: postiz:postiz-platform-api
  name: Postiz Platform API
  description: >-
    The full Postiz backend surface as published by the provider's own Swagger UI at
    https://api.postiz.com/docs, machine-readable at /docs-json — 205 operations across
    auth, integrations, posts, media, billing, settings, webhooks, notifications, admin
    and the /public/v1 Public API. Auto-generated from the NestJS controllers and
    served publicly; only the /public/v1 subset is a documented, supported contract.
  humanURL: https://api.postiz.com/docs
