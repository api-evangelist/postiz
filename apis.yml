  description: >-
    Configure a webhook URL in Postiz to receive an HTTP POST notifying your own systems when a post is
    published, so you can sync downstream tools such as spreadsheets, Slack, or a CRM. Webhooks are configured
    in the app rather than through a Public API endpoint.
