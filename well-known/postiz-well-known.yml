generated: '2026-08-13'
method: probed
source: live probe of every apis.yml host on 2026-08-13
summary: >-
  Postiz serves no security.txt, no api-catalog, no ai-plugin.json and no top-level
  OIDC or OAuth discovery document on any host. It DOES serve two real RFC 8414 /
  RFC 9728 discovery documents at path-suffixed well-known locations scoped to its
  MCP OAuth resource — /.well-known/oauth-authorization-server/mcp-oauth and
  /.well-known/oauth-protected-resource/mcp-oauth — both of which returned 200 with
  parsed JSON and are saved here verbatim. docs.postiz.com additionally serves an
  A2A agent card at /.well-known/agent-card.json (captured under a2a/) and an agent
  skill at /.well-known/agent-skills/postiz/skill.md (captured under skills/).
hosts:
- host: https://api.postiz.com
  documents:
  - {path: /.well-known/oauth-authorization-server/mcp-oauth, status: 200, file: postiz-oauth-authorization-server-mcp-oauth.json, kind: rfc8414-authorization-server-metadata}
  - {path: /.well-known/oauth-protected-resource/mcp-oauth, status: 200, file: postiz-oauth-protected-resource-mcp-oauth.json, kind: rfc9728-protected-resource-metadata}
