security_txt:
  served: false
  note: >-
    No /.well-known/security.txt on any host. Postiz does publish a full security
    policy and a coordinated-disclosure channel — see security/postiz-vulnerability-disclosure.yml
    — it is simply not advertised at the RFC 9116 location.
