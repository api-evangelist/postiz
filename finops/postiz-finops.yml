meters:
- name: subscription_tier
  description: Flat monthly Cloud subscription charge for the selected tier.
  unit: subscription
  aggregation: max
  dimensions:
  - account
  - plan
- name: channels
  description: Connected social channels (integrations) counted against the plan channel cap.
  unit: channels
  aggregation: max
  dimensions:
  - account
  - plan
- name: monthly_posts
  description: Posts published per month, capped on Standard and unlimited on higher Cloud tiers.
  unit: posts
  aggregation: sum
  dimensions:
  - account
  - plan
- name: ai_images
  description: AI images generated per month against the plan quota.
  unit: images
  aggregation: sum
  dimensions:
  - account
  - plan
- name: ai_videos
  description: AI videos generated per month against the plan quota.
  unit: videos
  aggregation: sum
  dimensions:
  - account
  - plan
- name: self_hosted_infrastructure
  description: Operator-borne compute, storage, and media-hosting cost for self-hosted deployments (not billed by Postiz).
  unit: usd
  aggregation: sum
  dimensions:
  - account
  - resource
principles:
- name: Visibility
  description: Track channel count, monthly post volume, and AI generation against plan caps; for self-hosting, track infrastructure spend separately.
- name: Allocation
  description: Use customer groups to map channels/posts to clients or teams, and tag self-hosted resources to cost centers.
- name: Optimization
  description: Self-host on free open-source if you can run infrastructure cheaply; otherwise right-size the Cloud tier to actual channel and AI needs and prefer annual billing.
- name: Accountability
  description: Assign an owner per Cloud subscription or self-hosted instance and review tier fit and AI quota burn monthly.
