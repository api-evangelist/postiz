description: >-
  FinOps view of Postiz spend. Postiz has two cost models. Self-hosting the AGPL-3.0
  open-source app has no license fee; cost is your own compute, storage, and media
  hosting plus any third-party platform/API costs. Postiz Cloud is a flat monthly
  subscription per tier (Standard, Team, Pro, Ultimate), with tier choice driven by
  channel count, monthly post volume, and AI image/video quota. The dominant cost
  levers are tier selection (Cloud) versus infrastructure footprint (self-hosted).
notes: >-
  Cloud prices and AI quotas are subject to change; verify on the pricing page during
  reconciliation. Self-hosted costs are entirely a function of the operator's chosen
  infrastructure and are not billed by Postiz.
