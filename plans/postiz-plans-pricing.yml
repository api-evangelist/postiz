description: >-
  Postiz is dual-licensed. The open-source app (AGPL-3.0, github.com/gitroomhq/postiz-app)
  is free to self-host with no per-seat or per-channel charge; you run and pay for
  your own infrastructure. Postiz Cloud is a managed SaaS sold in flat monthly tiers
  (Standard, Team, Pro, Ultimate) that differ by channel count, monthly post volume,
  AI image/video quota, and team support. The same Public API is available on both
  self-hosted and Cloud.
notes: >-
  Cloud prices and quotas are as published on the Postiz pricing page and may change;
  verify on the page. Annual billing is typically discounted. Self-hosting is free
  but you bear hosting, storage, and any third-party platform/API costs.
