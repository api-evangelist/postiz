lifecycle_notes:
- Deleting an Integration cascades to every scheduled Post on that channel.
- Deleting a Post by id deletes every Post in the same PostGroup.
- A published Post whose releaseId is "missing" is reconnected with updateReleaseId, which re-enables analytics for it.
