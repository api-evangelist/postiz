- version: v2.23.0
  date: '2026-08-04'
  title: Streamed media uploads, duplicate-post protection & MCP fixes
  breaking: false
  highlights:
  - Provider media uploads now stream instead of buffering whole files in memory (X videos in 1MB ranged chunks, LinkedIn in 2MB ranges).
  - New pending-post workflow resolves in-flight post state before publishing, preventing duplicate posts when a publish attempt is interrupted.
  - MCP server stability and OAuth fixes.
  - SSRF protection for webhooks and media-path fetches via a safe request dispatcher.
- version: v2.22.1
  date: '2026-07-25'
  breaking: false
  highlights:
