rest_only:
- capability: media upload
  operations: [uploadFile, uploadFromUrl]
  reason: >-
    No MCP tool uploads media. Agents must supply already-hosted attachment URLs to
    schedulePostTool, or upload out of band through REST or the CLI.
- capability: channel lifecycle
  operations: [getIntegrationUrl, deleteChannel, isConnected]
  reason: >-
    Connecting a channel via OAuth, deleting a channel and checking key validity are
    REST-only; the MCP surface deliberately does not let an agent disconnect a channel.
- capability: scheduling helper
  operations: [findSlot]
  reason: Next-available-slot lookup has no MCP tool.
- capability: post lifecycle
  operations: [deletePost, deletePostByGroup, changePostStatus, getMissingContent, updateReleaseId]
  reason: >-
    Deleting posts, moving a post between draft and schedule, and the missing-releaseId
    reconciliation flow are REST-only. The MCP surface can create and re-settings a post
    but cannot delete one.
