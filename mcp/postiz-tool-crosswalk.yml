note: >-
  Derived by binding each published Postiz MCP tool to the Public API operationId(s)
  that back it. The live MCP tools/list is auth-gated (HTTP 401 on 2026-08-13), so the
  binding is by documented name, parameter set and return shape rather than by an
  observed inputSchema; confidence is recorded accordingly. Where a tool has a
  one-to-one REST twin with matching parameters the provider says so in its own docs
  (postsListTool "returns the same posts as the List Posts API endpoint"), and those
  rows are high confidence.
